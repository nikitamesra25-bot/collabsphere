<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="myId">
<header> 
    <h1>📋 Student Task & Progress Manager</h1> 
</header>

<section id="dashboard"> 
    <h2>Dashboard</h2> 
    <div class="stats"> 
        <div>Total: <span id="totalTasks">0</span></div> 
        <div>Completed: <span id="completedTasks">0</span></div> 
        <div>Pending: <span id="pendingTasks">0</span></div> 
        <div>Today: <span id="todayTasks">0</span></div> 
    </div> 
</section>


<section id="addTask"> 
    <h2>Create Task</h2> 
    <form id="taskForm">

  <input type="text" id="title" placeholder="Task Title" required>

  <textarea id="description" placeholder="Task Description"></textarea>

  <select id="priority">
    <option value="low">Low Priority</option>
    <option value="medium">Medium Priority</option>
    <option value="high">High Priority</option>
  </select>

  <input type="date" id="deadline">

  <input type="text" id="category" placeholder="Category">

  <button type="submit">Add Task</button>
</form>

</section>


<section id="filters">
  <h2>Search & Filter</h2>

  <input type="text" id="search" placeholder="Search tasks...">

  <select id="filterStatus">
    <option value="">All Status</option>
    <option value="completed">Completed</option>
    <option value="pending">Pending</option>
  </select>

  <select id="filterPriority">
    <option value="">All Priority</option>
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
  </select>

  <input type="text" id="filterCategory" placeholder="Category">

</section>


<section id="task-list">
  <h2>All Tasks</h2>
  <div id="tasksContainer">
  </div>
</section>
</div>

<script src="script.js"></script>
